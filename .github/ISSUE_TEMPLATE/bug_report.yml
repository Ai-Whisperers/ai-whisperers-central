name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug", "triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this behavior?
      placeholder: |
        1. Deploy stack with `./deploy.sh n8n`
        2. Send WhatsApp message
        3. See error in logs
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste relevant log output (sanitize sensitive data!)
      render: shell
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - n8n Pipeline
        - LiteLLM / Model Router
        - Evolution API / WhatsApp
        - Context API
        - STT / TTS / Vision
        - Hermes Code Agent
        - Monitoring / Grafana
        - Deployment / Docker
        - Other
  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission
      options:
        - label: I searched existing issues and confirmed this is not a duplicate
          required: true
        - label: I have sanitized any secrets or credentials from logs and screenshots
          required: true

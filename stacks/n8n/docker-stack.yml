version: "3.8"

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    hostname: n8n
    environment:
      - N8N_HOST=n8n.sunstein.cloud
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.sunstein.cloud/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres_postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_secure_2026
      - N8N_ENCRYPTION_KEY=a8f2b3c4d5e6f7g8h9i0j1k2l3m4n5o6
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_DIAGNOSTICS_ENABLED=false
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - EXECUTIONS_DATA_MAX_COUNT=1000
      - N8N_CONCURRENCY_PRODUCTION_LIMIT=5
      - N8N_METRICS=true
      - N8N_API_KEY=n8n_api_sunstein_2026
    volumes:
      - n8n-data:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=agent-net"
      - "traefik.http.routers.n8n.rule=Host(`n8n.sunstein.cloud`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.tls.certresolver=letsencryptresolver"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: '2'
      placement:
        constraints:
          - node.role == manager
    networks:
      - agent-net
      - aiw-infra-net

networks:
  agent-net:
    external: true
  aiw-infra-net:
    external: true

volumes:
  n8n-data:
    external: true

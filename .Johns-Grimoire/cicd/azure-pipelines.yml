              projects: '$(solutionPath)'
              arguments: '--configuration $(buildConfiguration) --no-restore'

          - task: PowerShell@2
            displayName: 'Run Performance Benchmarks'
            inputs:
              targetType: 'filePath'
              filePath: 'cicd/scripts/run-benchmarks.ps1'
              arguments: '-Configuration $(buildConfiguration) -OutputPath "$(Build.ArtifactStagingDirectory)/benchmarks"'
              pwsh: false

          - task: PowerShell@2
            displayName: 'Create Performance Benchmark Summary'
            inputs:
              targetType: 'inline'
              pwsh: false
              script: |
                Write-Host "=== Performance Benchmark Summary ===" -ForegroundColor Cyan
                Write-Host ""
                
                $severity = "$(QualityGate_Benchmarks_Severity)"
                if (-not $severity) { $severity = 'warning' }
                $gateFailed = $false

                function Write-GateIssue {
                  param([string]$GateSeverity, [string]$Message)
                  switch ($GateSeverity) {
                    'error'   { Write-Host "##vso[task.logissue type=error]$Message"; $script:gateFailed = $true }
                    'warning' { Write-Host "##vso[task.logissue type=warning]$Message" }
                    default   { Write-Host $Message }
                  }
                }
                
                $benchmarkPath = "$(Build.ArtifactStagingDirectory)/benchmarks"
                $avgSpeed = "N/A"       # Default, should be parsed from report
                $regressions = 0        # Default
                $improvements = 0       # Default
                
                # Try to read benchmark metrics if available
                if (Test-Path "$benchmarkPath/benchmark-summary.json") {
                  $report = Get-Content "$benchmarkPath/benchmark-summary.json" | ConvertFrom-Json
                  $avgSpeed = $report.AverageSpeed
                  $regressions = $report.Regressions
                  $improvements = $report.Improvements
                }
                
                $status = if ($regressions -eq 0) { "✅ No Regressions" }
                         elseif ($regressions -le 2) { "⚠️ Minor Regressions" }
                         else { "❌ Significant Regressions" }
                
                $regressionsText = if ($regressions -gt 0) {
                  "⚠️ **$regressions performance regressions** detected - review required"
                } else {
                  "✅ No performance regressions"
                }
                
                $improvementsText = if ($improvements -gt 0) {
                  "🎉 **$improvements performance improvements**!"
                } else {
                  ""
                }
                
                $summary = @"
                ## 🚀 Performance Benchmarks
                
                ### Performance Analysis Results
                
                | Metric | Value |
                |--------|-------|
                | **Status** | $status |
                | **Regressions** | $regressions |
                | **Improvements** | $improvements |
                
                $regressionsText
                
                $improvementsText
                
                **Note**: Benchmarks run on main and release branches to track performance over time.
                
                [View Detailed Benchmark Report]($(System.TeamFoundationCollectionUri)NuGet%20Packages/_build/results?buildId=$(Build.BuildId)&view=artifacts&pathAsName=false&type=publishedArtifacts)
                "@
                
                $summaryFile = "$benchmarkPath/benchmark-summary.md"
                $summary | Out-File -FilePath $summaryFile -Encoding utf8
                Write-Host "##vso[task.uploadsummary]$summaryFile"
                
                if ($regressions -gt 0) {
                  Write-GateIssue -GateSeverity $severity -Message "⚠️  Performance regressions detected: $regressions"
                  if ($gateFailed) {
                    exit 1
                  }
                }
                Write-Host ""

          - task: PowerShell@2
            displayName: 'Check Benchmark Report'
            condition: always()
            inputs:
              targetType: 'inline'
              pwsh: false
              script: |
                $reportPath = "$(Build.ArtifactStagingDirectory)/benchmarks"
                if (Test-Path $reportPath) {
                  Write-Host "##vso[task.setvariable variable=BenchmarkReportAvailable]true"
                } else {
                  Write-Host "##vso[task.setvariable variable=BenchmarkReportAvailable]false"
                }

          - task: PublishBuildArtifacts@1
            displayName: 'Publish Benchmark Report'
            condition: and(always(), eq(variables['BenchmarkReportAvailable'], 'true'))
            inputs:
              PathtoPublish: '$(Build.ArtifactStagingDirectory)/benchmarks'
              ArtifactName: 'benchmarks'
              publishLocation: 'Container'


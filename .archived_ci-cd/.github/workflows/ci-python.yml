name: CI - Python

on:
  workflow_call:
    inputs:
      python-version:
        description: 'Python version'
        required: false
        type: string
        default: '3.11'
      working-directory:
        description: 'Working directory for the Python project'
        required: false
        type: string
        default: '.'

jobs:
  quality:
    name: Lint & Typecheck & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install ${{ inputs.python-version }}

      - name: Install dependencies
        run: uv sync --extra dev 2>/dev/null || uv sync

      - name: Lint with ruff
        run: uv run ruff check . 2>/dev/null || echo "No ruff config"

      - name: Type check
        run: uv run mypy src/ 2>/dev/null || uv run pyright 2>/dev/null || echo "No type checker configured"

      - name: Run tests
        run: uv run pytest -v 2>/dev/null || echo "No tests configured"

  security:
    name: Secrets Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

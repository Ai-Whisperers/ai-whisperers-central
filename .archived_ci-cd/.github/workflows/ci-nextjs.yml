name: CI - Next.js

on:
  workflow_call:
    inputs:
      node-version:
        description: 'Node.js version'
        required: false
        type: string
        default: '20'
      package-manager:
        description: 'npm or pnpm'
        required: false
        type: string
        default: 'npm'
      pnpm-version:
        description: 'pnpm version (only used if package-manager is pnpm)'
        required: false
        type: string
        default: '9'
      working-directory:
        description: 'Working directory for the Next.js app'
        required: false
        type: string
        default: '.'
      supabase-url:
        description: 'Supabase URL for build (placeholder if not set)'
        required: false
        type: string
        default: 'https://placeholder.supabase.co'
      supabase-anon-key:
        description: 'Supabase anon key for build (placeholder if not set)'
        required: false
        type: string
        default: 'placeholder-anon-key'
      site-url:
        description: 'NEXT_PUBLIC_SITE_URL for build'
        required: false
        type: string
        default: 'http://localhost:3000'

jobs:
  quality:
    name: Lint & Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: |
            ${{ inputs.working-directory }}/package-lock.json
            ${{ inputs.working-directory }}/pnpm-lock.yaml

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: TypeScript check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Lint
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm lint
          else
            npm run lint
          fi
        continue-on-error: true

      - name: Build
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm build
          else
            npm run build
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.supabase-url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ inputs.supabase-anon-key }}
          NEXT_PUBLIC_SITE_URL: ${{ inputs.site-url }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Run tests
        run: |
          if [ "${{ inputs.package-manager }}" = "pnpm" ]; then
            pnpm test -- --run 2>/dev/null || echo "No tests configured"
          else
            npm test 2>/dev/null || echo "No tests configured"
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ inputs.supabase-url }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ inputs.supabase-anon-key }}

global:
  scrape_interval: 30s
  evaluation_interval: 30s

alerting:
  alertmanagers: []

rule_files: []

scrape_configs:
  - job_name: 'litellm'
    scrape_interval: 15s
    static_configs:
      - targets: ['litellm:4000']
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'docker'
    scrape_interval: 30s
    static_configs:
      - targets: ['host.docker.internal:9323']

  - job_name: 'uptime-kuma'
    scrape_interval: 60s
    static_configs:
      - targets: ['uptime-kuma:3001']
    metrics_path: '/metrics'

  - job_name: 'n8n'
    scrape_interval: 30s
    dns_sd_configs:
      - names:
          - 'tasks.n8n_n8n'
        type: 'A'
        port: 5678
    metrics_path: '/metrics'
    scheme: 'http'

  - job_name: 'nyx-analytics'
    scrape_interval: 30s
    static_configs:
      - targets: ['aiw-context-api:3100']
    metrics_path: '/metrics'
    scheme: 'http'
